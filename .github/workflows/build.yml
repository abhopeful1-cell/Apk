name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PATH: /usr/local/bin:/opt/hostedtoolcache/Python/3.10.21/x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Force Python 3.10 for all commands
        run: |
          sudo mkdir -p /usr/local/bin
          sudo ln -sf $(which python3.10) /usr/local/bin/python
          sudo ln -sf $(which python3.10) /usr/local/bin/python3
          echo "python -> $(which python)"; python --version
          echo "python3 -> $(which python3)"; python3 --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openjdk-17-jdk zlib1g-dev libffi-dev libssl-dev python3-pip build-essential libtool m4 autoconf automake libltdl-dev

      - name: Install Python build tools with explicit versions
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'buildozer>=1.4.6' 'cython<3.0' 'kivy>=2.2' 'pythonforandroid>=2023.11'

      - name: Clean stale Buildozer state
        run: |
          rm -rf .buildozer ~/.buildozer || true

      - name: Build APK
        run: |
          yes | buildozer android debug deploy run > build.log 2>&1 || {
            echo "===== BUILD FAILED — LAST 300 LINES ====="
            tail -n 300 build.log
            exit 1
          }
          echo "Build succeeded."

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk

      - name: Upload full build log (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
